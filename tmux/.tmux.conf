set -g mouse on
set -sg escape-time 50

set-option -g default-command "/bin/zsh"

set -g default-terminal "tmux-256color"
set -sa terminal-features ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g focus-events on

###########
# Palette #
###########
# Semantic aliases over terminal ANSI slots (colour0–15). These track the
# active Ghostty theme — swap Ghostty's theme and tmux follows automatically.
# Change these six lines to re-map roles without editing every style below.
set -g @bg        "default"    # inherit terminal background (transparent)
set -g @fg        "colour7"    # normal foreground (white)
set -g @muted     "colour8"    # bright black / dim gray — inactive elements
set -g @accent    "colour4"    # primary accent (blue)
set -g @accent-fg "colour0"    # text when on accent background (dark)
set -g @panel     "colour8"    # subtle elevation above bg — session pill, mode bg

# Pane styling
set -g pane-border-style 'fg=#{@muted}'
set -g pane-active-border-style 'fg=#{@accent}'

###########
# Plugins #
###########
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# NOTE: must custom before run `tpm/tpm`.
set -g @tpm-install "I";
set -g @tpm-update "U";
set -g @tpm-clean "u";

###########
# Styling #
###########
set -g status-style "bg=#{@bg}"
set -g status-left-length 80
set -g mode-style "fg=#{@accent},bg=#{@panel}"
set -g message-style "fg=#{@accent-fg},bg=#{@accent}"
set -g message-command-style "fg=#{@fg},bg=#{@bg}"

# Better window naming - use directory name instead of process
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g allow-rename off

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Right side: the active window's Claude org badge + 5h/7d usage, from the shared
# cache (claude-usage.sh). Tracks whichever subscription the focused tab is spending.
set -g status-right-length 80
set -g status-right "#(~/Development/tmux-agentbar/scripts/agentbar-status-right.sh #{session_id} #{window_index})"

# Refresh status bar (and #() format shells) frequently enough that
# per-window agent status icons feel live.
set -g status-interval 1

# Window tabs: number, name, and a tmux-agentbar agent-status icon when present.
setw -g window-status-format "#[fg=#{@muted},bg=#{@bg}] #I #W #(~/Development/tmux-agentbar/scripts/agentbar-window-status.sh #I)"
setw -g window-status-current-format "#[fg=#{@accent},bg=#{@bg},bold] #I #W #(~/Development/tmux-agentbar/scripts/agentbar-window-status.sh #I)"

# Session name with very subtle dark background - reverses colors when prefix is pressed
set -g status-left "#{?client_prefix,#[fg=#{@panel}]#[bg=#{@fg}],#[fg=#{@fg}]#[bg=#{@panel}]} #S #[default] "

# Allow terminal notifications to reach the outter terminal.
set -g allow-passthrough on

#############
# Shortcuts #
#############

# Toggle between two panes:
# - If zoomed: unzoom, then jump to the other pane
# - If unzoomed: jump to the other pane, then zoom it
bind-key m if-shell -F '#{window_zoomed_flag}' \
  'resize-pane -Z; last-pane' \
  'last-pane; resize-pane -Z'

# Open lazygit in a new window
bind-key g new-window -n lazygit 'lazygit'

# Cycle sessions
bind-key -r C-n switch-client -n
bind-key -r C-p switch-client -p
bind-key -r C-l switch-client -l

bind-key C-r source-file ~/.tmux.conf
bind-key C-s choose-tree -sZ

# In vi mode-keys, Escape defaults to `clear-selection` which makes choose-tree
# feel stuck. Restore the emacs-style "Escape cancels the mode" behavior.
bind-key -T copy-mode-vi Escape send-keys -X cancel
