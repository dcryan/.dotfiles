set -g mouse on
set -sg escape-time 10

set-option -g default-command "/bin/zsh"

set -g default-terminal "tmux-256color"
set -sa terminal-features ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g focus-events on

# Pane styling
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

###########
# Plugins #
###########
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# NOTE: must custom before run `tpm/tpm`.
set -g @tpm-install "I";
set -g @tpm-update "U";
set -g @tpm-clean "u";

###########
# Styling #
###########
# Tokyo Night palette, applied directly (no theme plugin).
set -g status-style "bg=#1a1b26"
set -g status-left-length 80
set -g mode-style "fg=#7aa2f7,bg=#24283b"
set -g message-style "fg=#1a1b26,bg=#7aa2f7"
set -g message-command-style "fg=#c0caf5,bg=#1a1b26"

# Better window naming - use directory name instead of process
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g allow-rename off

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Local plugin: tmux-cmux (developed at ~/Development/tmux-cmux)
run-shell '~/Development/tmux-cmux/tmux-cmux.tmux'

# Keep right side empty for minimal look
set -g status-right ""

# Refresh status bar (and #() format shells) frequently enough that
# per-window agent status icons feel live.
set -g status-interval 1

# Window tabs: number, name, and a tmux-cmux agent-status icon when present.
setw -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I #W #(~/Development/tmux-cmux/scripts/cmux-window-status.sh #I)"
setw -g window-status-current-format "#[fg=#7aa2f7,bg=#1a1b26,bold] #I #W #(~/Development/tmux-cmux/scripts/cmux-window-status.sh #I)"

# Session name with very subtle dark background - reverses colors when prefix is pressed
set -g status-left "#{?client_prefix,#[fg=#24283b]#[bg=#c0caf5],#[fg=#c0caf5]#[bg=#24283b]} #S #[default] "

# Allow terminal notifications to reach the outter terminal.
set -g allow-passthrough on

#############
# Shortcuts #
#############

# Toggle between two panes:
# - If zoomed: unzoom, then jump to the other pane
# - If unzoomed: jump to the other pane, then zoom it
bind-key m if-shell -F '#{window_zoomed_flag}' \
  'resize-pane -Z; last-pane' \
  'last-pane; resize-pane -Z'

# Open lazygit in a new window
bind-key g new-window -n lazygit 'lazygit'

# Cycle sessions
bind-key -r C-n switch-client -n
bind-key -r C-p switch-client -p
bind-key -r C-l switch-client -l

bind-key C-r source-file ~/.tmux.conf
bind-key C-s choose-tree -sZ
